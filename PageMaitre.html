<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Enseignements — Cours</title>

  <link rel="stylesheet" href="stylesFac.css">
</head>

<body>

  <div class="layout accueilPanel">

    <!-- ================= HEADER ================= -->
    <header class="header">
      <div class="headerPane">
        <div class="lblNom">
          <span class="lblNom-principal">
            Philippe Spoljar
          </span>

          <span class="lblNom-secondaire">
            Enseignements 2026-2027
          </span>
        </div>
      </div>
    </header>

    <!-- ================= COLONNE OUEST : MENU ================= -->
    <aside class="west">
      <nav
        class="verticalMainPanel"
        aria-label="Navigation des enseignements"
      >
        <a
          class="btMenusPages btMenusPages--accueil"
          href="index.html"
        >
          Accueil
        </a>

        <a
          class="btMenusPages"
          href="PageMaitre.html?page=pages/PageLS4.html" >L2 - Sémiologie et entités psychopathologiques
        </a>

        <a class="btMenusPages" href="PageMaitre.html?page=pages/PageLS6.html" >L3 - Observation et étude de cas 2
        </a>

        <a class="btMenusPages" href="PageMaitre.html?page=pages/PageDocs.html" >Documents phénoménologie</a>
      </nav>
    </aside>

    <!-- ================= CONTENU CENTRAL ================= -->
    <main class="center">
      <div class="htmlPresentation">

        <iframe
          id="coursFrame"
          class="htmlPresentation-frame"
          src="about:blank"
          title="Contenu du cours"
        ></iframe>

        <noscript>
          <p class="messageErreur">
            Activez JavaScript pour afficher automatiquement le contenu du cours.
          </p>
        </noscript>

      </div>
    </main>

    <!-- ================= COLONNE EST ================= -->
    <aside class="east" aria-hidden="true"></aside>

    <!-- ================= FOOTER ================= -->
    <footer class="footer">
      <div class="footerPanel">
        <div class="lblAdresse">
          mail :
          <a href="mailto:philippe.spoljar@u-picardie.fr">
            philippe.spoljar@u-picardie.fr
          </a>
        </div>
      </div>
    </footer>

  </div>

  <script>
    (function () {
      "use strict";

      const pagesAutorisees = new Set([
        "pages/PageLS4.html",
        "pages/PageLS6.html",
        "pages/PageDocs.html"
      ]);

      const params = new URLSearchParams(window.location.search);
      const pageDemandee = params.get("page");
      const iframe = document.getElementById("coursFrame");

      if (pageDemandee && pagesAutorisees.has(pageDemandee)) {
        iframe.src = pageDemandee;
      } else {
        iframe.src = "pages/PageLS4.html";
      }
    })();
  </script>

</body>
</html>
